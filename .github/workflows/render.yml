name: Reels yasash

on:
  push:
    paths:
      - "reels/**"
      - "src/**"
      - "scripts/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Emoji shrifti va ffmpeg o'rnatish
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji ffmpeg

      - run: npm ci
      - run: pip install -r scripts/requirements.txt

      - name: AI ovoz va AI rasmlarni tayyorlash
        run: python scripts/prepare.py

      - name: Tayyorlangan ovoz va rasmlarni saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gen
          git diff --cached --quiet || (git commit -m "AI ovoz va rasmlar [skip ci]" && git push)

      - name: Videolarni yasash
        run: npm run render

      - name: Videolarni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: reels-videolar
          path: out/*.mp4
