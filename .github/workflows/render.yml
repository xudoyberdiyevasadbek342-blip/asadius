name: Reels yasash

on:
  push:
    paths:
      - "reels/**"
      - "src/**"
      - "public/**"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Emoji shriftini o'rnatish
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji

      - run: npm ci

      - name: Videolarni yasash
        run: npm run render

      - name: Videolarni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: reels-videolar
          path: out/*.mp4
